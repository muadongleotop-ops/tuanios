name: Build App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH
    - name: Install ldid
      run: brew install ldid
    - name: Extract Source
      run: |
        unzip External_ESP_Free_Fire-main.zip
    - name: Build
      run: |
        cd External_ESP_Free_Fire-main
        export SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
        make package TARGET=iphone:clang:latest:14.0 SYSROOT=$SYSROOT
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: App-Build
        path: External_ESP_Free_Fire-main/packages/*.tipa
        
