name: Build App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH
    - name: Install ldid
      run: brew install ldid
    - name: Extract Source
      run: |
        unzip External_ESP_Free_Fire-main.zip
    - name: Build
      run: |
        cd External_ESP_Free_Fire-main
        export SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
        
        # 1. Tạo file header giả chứa toàn bộ hằng số bị thiếu
        echo '#ifndef HACK_DEFINES_H' > headers/hack_defines.h
        echo '#define HACK_DEFINES_H' >> headers/hack_defines.h
        echo '#define PID_PATH "/var/mobile/Library/Preferences/com.trollspeed.pid"' >> headers/hack_defines.h
        echo '#define NOTIFY_DESTROY_HUD "com.trollspeed.destroyhud"' >> headers/hack_defines.h
        echo '#define ROOT_PATH_NS(path) path' >> headers/hack_defines.h
        echo '#endif' >> headers/hack_defines.h
        
        # 2. Ép compiler include file giả này vào mọi file .mm
        rm -f Makefile
        cat << 'EOF' > Makefile
        TARGET := iphone:clang:latest:14.0
        ARCHS = arm64 arm64e
        include $(THEOS)/makefiles/common.mk
        APPLICATION_NAME = TrollSpeed
        
        TrollSpeed_FILES = $(wildcard sources/*.mm sources/*.m sources/*.cpp sources/*.c esp/*/*.mm esp/*/*.cpp)
        
        TrollSpeed_FRAMEWORKS = UIKit Foundation CoreGraphics QuartzCore Security
        
        TrollSpeed_CFLAGS = -fobjc-arc -Iheaders -I. -Iesp -Isources -include headers/hack_defines.h -Wno-everything
        TrollSpeed_LDFLAGS = -undefined dynamic_lookup
        include $(THEOS_MAKE_PATH)/application.mk
        EOF
        
        make package SYSROOT=$SYSROOT
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: App-Build
        path: External_ESP_Free_Fire-main/packages/*.tipa
